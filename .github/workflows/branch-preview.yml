name: Isolated branch preview
on:
  push:
    branches: [lz-carry-knowledge-hub]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: |
          npm init -y
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium
      - name: Run responsive and functionality checks
        run: npx playwright test
      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lz-carry-knowledge-hub-preview
          path: |
            artifacts/
            test-results/
          if-no-files-found: warn
          retention-days: 14
